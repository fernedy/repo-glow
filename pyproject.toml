[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-glow"
version = "1.0.0"
description = "Audit how shiny your repository looks: Glow Score 0-100, zero dependencies"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Fernedy Arias" }]
keywords = ["github", "readme", "audit", "developer-tools", "cli", "ai"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
repo-glow = "repo_glow:main"

[tool.setuptools]
py-modules = ["repo_glow"]
